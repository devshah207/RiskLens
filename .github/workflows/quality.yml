name: RiskLens quality checks
on:
  push:
    branches: [main, "feature/**", "experiment/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deep,tuning]" ruff
      - name: Lint
        run: ruff check src tests scripts --select F,E4,E7,E9
      - name: Unit tests
        run: python -m pytest -q
