[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens-educational"
version = "0.1.0"
description = "Educational financial risk-model validation and research project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RiskLens Contributors"}]
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<1.10", "xgboost>=2.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
deep = ["torch>=2.2,<3"]
tuning = ["optuna>=4,<5", "torch>=2.2,<3"]
research-base = ["pymupdf>=1.24,<2"]
research-docling = ["docling>=2,<3"]
research-embeddings = ["sentence-transformers>=3,<7"]
research-cloud = ["groq>=0.13,<2", "pinecone>=7,<11"]
research-all = ["pymupdf>=1.24,<2", "docling>=2,<3", "sentence-transformers>=3,<7", "groq>=0.13,<2", "pinecone>=7,<11"]

[project.scripts]
risklens-validate = "risklens.data.cli:main"
risklens = "risklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
